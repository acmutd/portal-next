query getHomePageUserInfo($where: ProfileWhereUniqueInput!) {
  me {
    isDirector
    isOfficer
    isMember
    attendedEvents {
      description
      location
      summary
      start
    }
  }
  profile(where: $where) {
    firstName
    netid
    email
    officer {
      divisions {
        deptName
      }
    }
  }
}
